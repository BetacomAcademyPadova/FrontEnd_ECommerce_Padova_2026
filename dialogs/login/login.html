<div class="dialog-container">
    <button mat-icon-button mat-dialog-close class="dialog-close-btn">
        <mat-icon>close</mat-icon>
    </button>

    <h2 mat-dialog-title class="login-title">
        <mat-icon>account_circle</mat-icon>
        ACCEDI
    </h2>

    <mat-dialog-content>
        <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" class="login-form">
            
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Username</mat-label>
                <input matInput name="username" ngModel required>
                <mat-icon matSuffix>person</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Password</mat-label>
                <input matInput type="password" name="password" ngModel required>
                <mat-icon matSuffix>lock</mat-icon>
            </mat-form-field>

            <p style="color:red" class="error-msg">{{msg()}}</p>

            <div class="button-group">
                <div class="button-group">
                <button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.valid">
                    <mat-icon>login</mat-icon>
                    Accedi
                </button>
                <button type="button" class="register-btn" (click)="registrazione()">
                    <mat-icon>person_add</mat-icon>
                    Registrati
                </button>
            </div>
            </div>
            <div class="forgot-container">
            <button type="button" class="forgot-pwd" (click)="passwordDimenticata()">
                <mat-icon>lock_reset</mat-icon>
                Password dimenticata?
            </button>
        </div>
        </form>
    </mat-dialog-content>
</div>
