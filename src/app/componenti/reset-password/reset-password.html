<div class="reset-container">
    <mat-card class="reset-card">
        <mat-card-header>
            <mat-card-title>Cambia password</mat-card-title>
            <mat-card-subtitle>
                Inserisci la nuova password per il tuo account
            </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nuova password</mat-label>
                <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="password">
                <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
                    <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Conferma password</mat-label>
                <input matInput [type]="hideConfirmPassword  ? 'password' : 'text'" [(ngModel)]="confirmPassword">
                <button mat-icon-button matSuffix type="button" (click)="hideConfirmPassword  = !hideConfirmPassword">
                    <mat-icon>{{hideConfirmPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>
            <p [class.success]="success" [class.failure]="!success">{{msg}}</p>
        </mat-card-content>
        <mat-card-actions>
            <button mat-raised-button color="primary" class="reset-button" (click)="cambiaPassword()">Cambia password</button>
        </mat-card-actions>
    </mat-card>
</div>
