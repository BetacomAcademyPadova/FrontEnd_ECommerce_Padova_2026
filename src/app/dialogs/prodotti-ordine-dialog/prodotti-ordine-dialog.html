<h2 mat-dialog-title>Prodotti ordine</h2>

<mat-dialog-content>
  <table>
    <thead>
      <tr>
        <th>Prodotto</th>
        <th>Quantità</th>
        <th>Prezzo</th>
      </tr>
    </thead>

    <tbody>
      @for(p of prodotti; track p.idItem){

      <tr>
        <td>{{p.prodotto}}</td>

        <td>{{p.quantita}}</td>

        <td>{{p.prezzo | number:'1.2-2'}} €</td>
      </tr>

      }
    </tbody>
  </table>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" mat-dialog-close>Chiudi</button>
</mat-dialog-actions>
